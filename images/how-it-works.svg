<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 240" width="1140" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- The two setups are alternatives: a divider with OR between them -->
  <line x1="262" y1="120" x2="898" y2="120" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="551" y="106" width="58" height="28" rx="14" fill="#f0883e"/>
  <text x="580" y="121" fill="#0b0d18" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">OR</text>
  <g fill="#7c8cff" font-size="14" font-weight="700">
    <text x="262" y="104">With a GB-Link</text>
    <text x="262" y="148">Without a GB-Link</text>
  </g>

  <g fill="#7c8cff" stroke="#5b6ad0" stroke-width="1.5">
    <rect x="10" y="90" width="180" height="60" rx="12"/>
    <rect x="330" y="20" width="160" height="60" rx="12"/>
    <rect x="740" y="20" width="140" height="60" rx="12"/>
    <rect x="740" y="160" width="140" height="60" rx="12"/>
    <rect x="960" y="80" width="170" height="80" rx="12"/>
  </g>
  <g fill="#0b0d18" font-size="17" text-anchor="middle" dominant-baseline="middle">
    <text x="100" y="121">Game Boy Advance</text>
    <text x="410" y="51">GB-Link adapter</text>
    <text x="810" y="51">ESP32 board</text>
    <text x="810" y="191">ESP32 board</text>
    <text x="1045" y="109">Nintendo Switch</text>
    <text x="1045" y="133" font-size="14">FireRed / LeafGreen</text>
  </g>
  <g fill="none" stroke="#8b949e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <polyline points="194,110 240,110 240,50 326,50"/>
    <line x1="494" y1="50" x2="736" y2="50"/>
    <polyline points="194,130 240,130 240,190 736,190"/>
    <polyline points="884,50 920,50 920,105 956,105"/>
    <polyline points="884,190 920,190 920,135 956,135"/>
  </g>
  <g fill="#8b949e" font-size="13" text-anchor="middle">
    <text x="284" y="40">link cable</text>
    <text x="615" y="24">expansion port, 3 wires,</text>
    <text x="615" y="40">or USB through the page</text>
    <text x="488" y="178">link cable wired to the board: the board is the adapter</text>
    <text x="1045" y="66">local wireless</text>
  </g>
</svg>
